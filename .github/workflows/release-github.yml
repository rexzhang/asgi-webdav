name: Release Package to GitHub

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build assets for (e.g. v2.1.0)"
        required: true
        type: string
      ref:
        description: "Optional git ref to build from (defaults to the tag); use when the tag predates a build fix"
        required: false
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REF: ${{ inputs.ref || inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          generate_release_notes: true

  build:
    name: Build standalone (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            out_file: asgi-webdav-macos.zip
          - os: windows-latest
            out_file: asgi-webdav-windows.zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -U -r requirements.d/basic.txt -r requirements.d/standalone.txt "pyinstaller>=6.21"
      - name: Build with PyInstaller
        run: pyinstaller asgi-webdav.spec
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r9 asgi-webdav asgi-webdav
          mv asgi-webdav.zip asgi-webdav-macos.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/asgi-webdav.exe -DestinationPath dist/asgi-webdav-windows.zip
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          fail_on_unmatched_files: true
          files: dist/${{ matrix.out_file }}
